<!doctype html>
<html>
    <body>
        <div id="app" style="height: 100vh; display: flex"></div>
        <script type="module">
            import {createApp, h, nextTick, ref} from "vue";
            import Thread from "/src/chat/Thread.vue";
            import {choose} from "/src/state/environment.js";
            import {ui} from "/src/state/ui.js";
            import "/src/tokens.css";

            choose("main");
            let sequence = 0;
            const message = (id, text, author = "agent") => ({
                table: "messages", id, text, author, session: "fixture", thread: "main", files: [], data: {},
                created_at: new Date(1700000000000 + sequence++ * 60000).toISOString(),
            });
            const messages = ref(Array.from({length: 45}, (_, index) => message(1000 + index, `Earlier message ${index + 1}`, index % 2 ? "agent" : "user")));
            window.receiveMessages = (rows) => messages.value.push(...rows.map(({id, text}) => message(id, text)));
            window.returnToTab = async () => {
                ui.away.tabHidden = true;
                ui.away.readingLatest = true;
                await nextTick();
                ui.away.tabHidden = false;
                ui.away.returnedAt = Date.now();
                await nextTick();
                ui.away.readingLatest = false;
                await nextTick();
            };
            const scope = {
                env: "main", rows: (table) => table === "messages" ? messages.value : [], loaded: () => true,
                earlier: async () => {}, holding: async () => {}, keepRows: () => {}, releaseRows: () => {},
                api: {activeCards: async () => ({}), list: async () => ({rows: [], is_last_page: true})},
            };
            const app = createApp({render: () => h(Thread)});
            app.provide("scope", scope);
            app.directive("tip", {});
            app.mount("#app");
        </script>
    </body>
</html>
