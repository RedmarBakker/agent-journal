[pytest]
testpaths = tests
pythonpath = src tests
python_files = test_*.py */stories/*/*.py
addopts = -p no:cacheprovider -q
markers =
    starts_from: the state a scenario starts from
    ends_in: the stack a scenario ends on
    settings: a setting the user sets before a scenario's first step
    provider: the provider a scenario runs on, where the provider is what it tests
filterwarnings =
    ignore:This process .* is multi-threaded, use of forkpty:DeprecationWarning
