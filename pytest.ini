[pytest]
testpaths = tests
pythonpath = src tests
python_files = test_*.py scenario_*.py
addopts = -p no:cacheprovider -q
markers =
    starts_from: the state a scenario starts from
    ends_in: the stack a scenario ends on
filterwarnings =
    ignore:This process .* is multi-threaded, use of forkpty:DeprecationWarning
